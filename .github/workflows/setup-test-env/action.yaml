name: 'Setup Testing Environment'
description: 'Set up the testing environment for running tests from the build workflow.'

inputs:
  package:
    description: 'The package to set up the test environment for.'
    required: true
    default: 'all'
  test_env_vars:
    description: 'Newline-separated KEY=VALUE pairs to inject as environment variables into the test services.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Start Grafana LGTM (logging-connector-opentelemetry)
      if: inputs.package == 'packages/logging-connector-opentelemetry' || inputs.package == 'all'
      shell: bash
      run: |
        docker run -d --name twin-opentelemetry \
          -p 4317:4317 -p 4318:4318 \
          -p 3123:3000 -p 3200:3200 \
          grafana/otel-lgtm
        echo "Waiting for OTLP HTTP endpoint..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4318/ > /dev/null 2>&1; then
            echo "OTLP endpoint ready"
            break
          fi
          sleep 2
        done
        echo "Grafana LGTM ready"

    # Start Elasticsearch only for the ELK logging connector package
    - name: Start Elasticsearch
      if: inputs.package == 'packages/logging-connector-elk' || inputs.package == 'all'
      shell: bash
      run: |
        docker run -d --name twin-logging-elasticsearch \
          -p 9200:9200 \
          -e "discovery.type=single-node" \
          -e "xpack.security.enabled=false" \
          docker.elastic.co/elasticsearch/elasticsearch:9.4.3

    - name: Wait for Elasticsearch
      if: inputs.package == 'packages/logging-connector-elk' || inputs.package == 'all'
      shell: bash
      run: |
        for i in $(seq 1 30); do
          curl -sf http://localhost:9200/_cluster/health && break
          echo "Attempt $i: waiting for Elasticsearch..."
          sleep 5
        done
